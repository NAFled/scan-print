<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scan &amp; Print</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root {
  --bg-primary:#0c0e13;--bg-card:#1a1e27;--bg-input:#12151b;--border:#2a2f3a;--border-focus:#3d8bfd;
  --text-primary:#e8ecf1;--text-secondary:#8a92a1;--text-muted:#555d6e;
  --accent:#3d8bfd;--accent-dim:#2a6ad4;
  --green:#00d68f;--green-dim:rgba(0,214,143,0.12);
  --red:#ff4757;--red-dim:rgba(255,71,87,0.12);
  --orange:#ffa502;--orange-dim:rgba(255,165,2,0.12);
  --mono:'JetBrains Mono','Fira Code',monospace;--sans:'DM Sans',-apple-system,sans-serif;
  --radius:10px;--radius-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg-primary);color:var(--text-primary);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;position:relative}
.header{padding:16px 20px 0;flex-shrink:0}
.header h1{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px}
.header h1 .icon{font-size:22px}
.tab-bar{display:flex;gap:4px;padding:12px 20px 0;flex-shrink:0}
.tab-btn{flex:1;padding:10px 0;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.8px}
.tab-btn:hover{color:var(--text-secondary)}.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.tab-panel{display:none}.tab-panel.active{display:block}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-bottom:12px}
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.status-dot.ok{background:var(--green);box-shadow:0 0 8px rgba(0,214,143,.4)}
.status-dot.err{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.4)}
.status-dot.warn{background:var(--orange);box-shadow:0 0 8px rgba(255,165,2,.4)}
.status-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.video-wrap{position:relative;width:100%;aspect-ratio:4/3;background:var(--bg-input);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;border:1px solid var(--border)}
.video-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.video-wrap .overlay-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;gap:8px}
.video-wrap .overlay-msg .big-icon{font-size:40px;opacity:.5}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scanMove 2.5s ease-in-out infinite;display:none}
.scanning .scan-line{display:block}
@keyframes scanMove{0%,100%{top:20%}50%{top:75%}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:none;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dim)}
.btn-secondary{background:var(--bg-input);color:var(--text-secondary);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--text-muted);color:var(--text-primary)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}.btn-block{width:100%}.btn-row{display:flex;gap:8px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;letter-spacing:.3px}
.form-input,.form-select{width:100%;padding:10px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus{border-color:var(--border-focus)}
.form-select{font-family:var(--sans);cursor:pointer}.form-select option{background:var(--bg-card)}
.form-row{display:flex;gap:10px}.form-row>*{flex:1}
.barcode-display{background:var(--bg-input);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;margin-bottom:12px;min-height:52px;display:flex;align-items:center;justify-content:center}
.barcode-display .value{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--green);word-break:break-all}
.barcode-display .empty{color:var(--text-muted);font-size:13px}
.barcode-display .format-tag{font-size:10px;font-weight:700;color:var(--accent);background:rgba(61,139,253,.12);padding:2px 8px;border-radius:4px;margin-left:10px;text-transform:uppercase}
.history-list{display:flex;flex-direction:column;gap:6px}
.history-item,.log-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg-input);border-radius:var(--radius-sm);border:1px solid var(--border)}
.history-item .code,.log-item .code{font-family:var(--mono);font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .time,.log-item .time{font-size:11px;color:var(--text-muted);flex-shrink:0}
.log-item .status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;flex-shrink:0}
.log-item .status-badge.ok{background:var(--green-dim);color:var(--green)}
.log-item .status-badge.err{background:var(--red-dim);color:var(--red)}
.reprint-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:16px;cursor:pointer;flex-shrink:0;transition:all .15s}
.reprint-btn:hover{border-color:var(--accent);color:var(--accent)}
.method-selector{display:flex;gap:6px;margin-bottom:16px}
.method-btn{flex:1;padding:10px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.method-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(61,139,253,.08)}
.method-panel{display:none}.method-panel.active{display:block}
.zpl-preview{background:#fff;color:#000;border-radius:var(--radius-sm);padding:16px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto;margin-bottom:12px;border:1px solid var(--border)}
@keyframes flashGreen{0%{box-shadow:inset 0 0 0 2px var(--green)}100%{box-shadow:inset 0 0 0 0 transparent}}
.flash-green{animation:flashGreen .6s ease-out}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}.empty-state .big-icon{font-size:36px;margin-bottom:10px;opacity:.4}.empty-state p{font-size:13px}
.toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:var(--sans);animation:toastIn .3s ease-out;pointer-events:auto}
.toast.ok{background:var(--green);color:#0c0e13}.toast.err{background:var(--red);color:#fff}.toast.info{background:var(--accent);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1><span class="icon">⬡</span> Scan &amp; Print</h1></div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="scanner">▦ Scanner</button>
    <button class="tab-btn" data-tab="settings">⚙ Einstellungen</button>
    <button class="tab-btn" data-tab="log">☰ Log</button>
  </div>
  <div class="tab-content">
    <div class="tab-panel active" id="tab-scanner">
      <div class="card">
        <div class="status-row"><div class="status-dot" id="printer-dot"></div><span class="status-label" id="printer-status">Drucker nicht verbunden</span></div>
        <div class="video-wrap" id="video-wrap"><video id="cam-video" autoplay playsinline muted></video><div class="scan-line"></div><div class="overlay-msg" id="cam-overlay"><span class="big-icon">📷</span><span>Kamera starten um zu scannen</span></div></div>
        <div class="form-group"><label class="form-label">Kamera</label><select class="form-select" id="camera-select"><option value="">— Kamera wählen —</option></select></div>
        <div class="btn-row"><button class="btn btn-primary btn-block" id="btn-start-scan">▶ Scan starten</button><button class="btn btn-secondary btn-block" id="btn-stop-scan" style="display:none">■ Stoppen</button></div>
      </div>
      <div class="card"><div class="card-title">Erkannter Barcode</div><div class="barcode-display" id="barcode-display"><span class="empty">Warte auf Scan…</span></div></div>
      <div class="card"><div class="card-title">Manuelle Eingabe</div><div style="display:flex;gap:8px"><input type="text" class="form-input" id="manual-input" placeholder="Barcode eingeben…" style="flex:1"><button class="btn btn-primary" id="btn-manual-print">⎙</button></div></div>
      <div class="card"><div class="card-title">Letzte Scans</div><div class="history-list" id="history-list"><div class="empty-state"><div class="big-icon">📋</div><p>Noch keine Scans</p></div></div></div>
    </div>
    <div class="tab-panel" id="tab-settings">
      <div class="card">
        <div class="card-title">Druckmethode</div>
        <div class="method-selector"><button class="method-btn active" data-method="http">🌐 Netzwerk</button><button class="method-btn" data-method="cups">🖨 CUPS</button><button class="method-btn" data-method="bt">📶 Bluetooth</button></div>
        <div class="method-panel active" id="panel-http">
          <div class="form-group"><label class="form-label">Server-URL</label><input type="url" class="form-input" id="http-url" placeholder="http://192.168.1.100:9100"></div>
          <div class="form-group"><label class="form-label">Pfad (optional)</label><input type="text" class="form-input" id="http-path" placeholder="/print"></div>
          <div class="form-row"><div class="form-group"><label class="form-label">Benutzer</label><input type="text" class="form-input" id="http-user" placeholder="optional"></div><div class="form-group"><label class="form-label">Passwort</label><input type="password" class="form-input" id="http-pass" placeholder="optional"></div></div>
          <button class="btn btn-secondary btn-block" id="btn-test-http">🔌 Verbindung testen</button>
        </div>
        <div class="method-panel" id="panel-cups">
          <div class="form-group"><label class="form-label">CUPS Server-URL</label><input type="url" class="form-input" id="cups-url" value="http://localhost:631"></div>
          <div class="form-row"><div class="form-group"><label class="form-label">Benutzer</label><input type="text" class="form-input" id="cups-user" placeholder="optional"></div><div class="form-group"><label class="form-label">Passwort</label><input type="password" class="form-input" id="cups-pass" placeholder="optional"></div></div>
          <div class="form-group"><label class="form-label">Drucker</label><div style="display:flex;gap:8px"><select class="form-select" id="cups-printer" style="flex:1"><option value="">— Drucker laden —</option></select><button class="btn btn-secondary" id="btn-load-cups">⟳</button></div></div>
        </div>
        <div class="method-panel" id="panel-bt">
          <div class="form-group"><label class="form-label">Bluetooth-Drucker</label><div id="bt-device-name" style="font-family:var(--mono);font-size:13px;color:var(--text-muted);margin-bottom:10px">Nicht verbunden</div></div>
          <button class="btn btn-primary btn-block" id="btn-bt-connect">📶 Drucker suchen &amp; verbinden</button>
          <button class="btn btn-secondary btn-block" id="btn-bt-disconnect" style="display:none;margin-top:8px">✕ Trennen</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Druckformat</div>
        <div class="form-group"><label class="form-label">Druckersprache</label><select class="form-select" id="print-lang"><option value="zpl">ZPL (Zebra)</option><option value="epl">EPL (Eltron)</option><option value="tspl">TSPL (TSC)</option><option value="escpos">ESC/POS</option><option value="raw">RAW (Klartext)</option></select></div>
        <div class="form-row"><div class="form-group"><label class="form-label">Label-Breite (mm)</label><input type="number" class="form-input" id="label-w" value="50" min="10" max="200"></div><div class="form-group"><label class="form-label">Label-Höhe (mm)</label><input type="number" class="form-input" id="label-h" value="30" min="10" max="200"></div></div>
      </div>
      <div class="card"><div class="card-title">Ausgabe-Format</div><div class="method-selector"><button class="method-btn active" data-output="qr">◫ QR-Code (2D)</button><button class="method-btn" data-output="1d">▥ EAN / Code128</button></div></div>
      <div class="card"><div class="card-title">ZPL-Vorschau</div><div class="zpl-preview" id="zpl-preview"></div><button class="btn btn-secondary btn-block" id="btn-test-print">⎙ Testdruck</button></div>
    </div>
    <div class="tab-panel" id="tab-log">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="card-title" style="margin-bottom:0">Druckprotokoll</div><div class="btn-row"><button class="btn btn-secondary btn-sm" id="btn-export-csv">⬇ CSV</button><button class="btn btn-danger btn-sm" id="btn-clear-log">✕ Löschen</button></div></div>
        <div id="log-list"><div class="empty-state"><div class="big-icon">📄</div><p>Noch keine Druckaufträge</p></div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<script>
(()=>{
'use strict';

const state = { scanning:false, lastScanValue:'', lastScanTime:0, history:[], log:[], stream:null, detector:null, scanTimer:null, btDevice:null, btChar:null, btServer:null };
const DUPE_WINDOW=2500, MAX_HISTORY=8, SAMPLE='4006381333931';

// ── All known BLE printer service UUIDs ──
const BT_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2','0000ff00-0000-1000-8000-00805f9b34fb',
  '0000fff0-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb',
  '0000ae30-0000-1000-8000-00805f9b34fb','0000aaf0-0000-1000-8000-00805f9b34fb',
  '00001101-0000-1000-8000-00805f9b34fb','0000feea-0000-1000-8000-00805f9b34fb',
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e','0000ffe0-0000-1000-8000-00805f9b34fb',
  '00001800-0000-1000-8000-00805f9b34fb',
];

const $=id=>document.getElementById(id);
const video=$('cam-video'), overlay=$('cam-overlay'), videoWrap=$('video-wrap');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ══════ SETTINGS ══════
const SK='scanprint_settings';
function loadSettings(){try{const s=JSON.parse(localStorage.getItem(SK));if(!s)return;if(s.method)selectMethod(s.method);if(s.httpUrl)$('http-url').value=s.httpUrl;if(s.httpPath)$('http-path').value=s.httpPath;if(s.httpUser)$('http-user').value=s.httpUser;if(s.httpPass)$('http-pass').value=s.httpPass;if(s.cupsUrl)$('cups-url').value=s.cupsUrl;if(s.cupsUser)$('cups-user').value=s.cupsUser;if(s.cupsPass)$('cups-pass').value=s.cupsPass;if(s.printLang)$('print-lang').value=s.printLang;if(s.labelW)$('label-w').value=s.labelW;if(s.labelH)$('label-h').value=s.labelH;if(s.outputMode)selectOutput(s.outputMode);if(s.log)state.log=s.log;if(s.history)state.history=s.history.slice(0,MAX_HISTORY);}catch(e){}}
function saveSettings(){localStorage.setItem(SK,JSON.stringify({method:getMethod(),httpUrl:$('http-url').value,httpPath:$('http-path').value,httpUser:$('http-user').value,httpPass:$('http-pass').value,cupsUrl:$('cups-url').value,cupsUser:$('cups-user').value,cupsPass:$('cups-pass').value,printLang:$('print-lang').value,labelW:$('label-w').value,labelH:$('label-h').value,outputMode:getOutput(),log:state.log,history:state.history}));}

// ══════ TABS ══════
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('tab-'+b.dataset.tab).classList.add('active');}));
function getMethod(){return document.querySelector('.method-btn[data-method].active')?.dataset.method||'http';}
function selectMethod(m){document.querySelectorAll('.method-btn[data-method]').forEach(b=>b.classList.toggle('active',b.dataset.method===m));document.querySelectorAll('.method-panel').forEach(p=>p.classList.remove('active'));const p=$('panel-'+m);if(p)p.classList.add('active');}
document.querySelectorAll('.method-btn[data-method]').forEach(b=>b.addEventListener('click',()=>{selectMethod(b.dataset.method);saveSettings();}));
function getOutput(){return document.querySelector('.method-btn[data-output].active')?.dataset.output||'qr';}
function selectOutput(m){document.querySelectorAll('.method-btn[data-output]').forEach(b=>b.classList.toggle('active',b.dataset.output===m));updatePreview();}
document.querySelectorAll('.method-btn[data-output]').forEach(b=>b.addEventListener('click',()=>{selectOutput(b.dataset.output);saveSettings();}));

function toast(msg,type='info'){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('toast-container').appendChild(el);setTimeout(()=>el.remove(),2800);}

// ══════ CAMERA ══════
async function enumCams(){try{const d=await navigator.mediaDevices.enumerateDevices();const c=d.filter(x=>x.kind==='videoinput');const s=$('camera-select');s.innerHTML='';c.forEach((x,i)=>{const o=document.createElement('option');o.value=x.deviceId;const l=x.label||('Kamera '+(i+1));o.textContent=l;if(/back|rear|rück|umgebung|environment/i.test(l))o.selected=true;s.appendChild(o);});if(!s.value&&c.length)s.selectedIndex=c.length-1;}catch(e){}}
function initDetector(){if('BarcodeDetector'in window){state.detector=new BarcodeDetector({formats:['qr_code','ean_13','ean_8','code_128','code_39','code_93','data_matrix','upc_a','upc_e','codabar','itf','pdf417','aztec']});return true;}return false;}
async function startScan(){if(state.scanning)return;const id=$('camera-select').value;try{state.stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id},facingMode:'environment'}:{facingMode:'environment'}});video.srcObject=state.stream;await video.play();overlay.style.display='none';videoWrap.classList.add('scanning');state.scanning=true;$('btn-start-scan').style.display='none';$('btn-stop-scan').style.display='';await enumCams();scanLoop();}catch(e){toast('Kamera: '+e.message,'err');}}
function stopScan(){state.scanning=false;if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;}video.srcObject=null;overlay.style.display='';videoWrap.classList.remove('scanning');$('btn-start-scan').style.display='';$('btn-stop-scan').style.display='none';if(state.scanTimer){cancelAnimationFrame(state.scanTimer);state.scanTimer=null;}}
async function scanLoop(){if(!state.scanning||!state.detector)return;try{const bc=await state.detector.detect(video);if(bc.length>0)handleScan(bc[0].rawValue,bc[0].format);}catch(e){}state.scanTimer=requestAnimationFrame(()=>setTimeout(scanLoop,120));}
function handleScan(v,f='unknown'){if(!v||!v.trim())return;v=v.trim();const now=Date.now();if(v===state.lastScanValue&&(now-state.lastScanTime)<DUPE_WINDOW)return;state.lastScanValue=v;state.lastScanTime=now;showBarcode(v,f);state.history.unshift({value:v,format:f,time:new Date().toLocaleTimeString('de-DE')});if(state.history.length>MAX_HISTORY)state.history.pop();renderHistory();executePrint(v);saveSettings();}
function showBarcode(v,f){const el=$('barcode-display');el.innerHTML=`<span class="value">${esc(v)}</span>`+(f&&f!=='unknown'?`<span class="format-tag">${f}</span>`:'');el.classList.remove('flash-green');void el.offsetWidth;el.classList.add('flash-green');}
function renderHistory(){const el=$('history-list');if(!state.history.length){el.innerHTML='<div class="empty-state"><div class="big-icon">📋</div><p>Noch keine Scans</p></div>';return;}el.innerHTML=state.history.map((h,i)=>`<div class="history-item"><span class="code" title="${esc(h.value)}">${esc(h.value)}</span><span class="time">${h.time}</span><button class="reprint-btn" onclick="window._rp(${i})">↺</button></div>`).join('');}
window._rp=i=>{if(state.history[i])executePrint(state.history[i].value);};
window._rl=i=>{if(state.log[i])executePrint(state.log[i].value);};

// ══════ BLUETOOTH – FIXED ══════
async function findWritableChar(server){
  // Try all known service UUIDs
  for(const uuid of BT_SERVICES){
    try{
      const svc=await server.getPrimaryService(uuid);
      const chars=await svc.getCharacteristics();
      for(const c of chars){
        if(c.properties.writeWithoutResponse||c.properties.write){
          console.log('BT: found writable on',uuid,c.uuid);
          return c;
        }
      }
    }catch(e){}
  }
  // Fallback: discover ALL accessible services
  try{
    const svcs=await server.getPrimaryServices();
    for(const svc of svcs){
      try{
        const chars=await svc.getCharacteristics();
        for(const c of chars){
          if(c.properties.writeWithoutResponse||c.properties.write){
            console.log('BT: found writable via discovery on',svc.uuid,c.uuid);
            return c;
          }
        }
      }catch(e){}
    }
  }catch(e){}
  return null;
}

async function connectBT(){
  if(!navigator.bluetooth){toast('Web Bluetooth nicht verfügbar','err');return;}
  try{
    const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SERVICES});
    await attachDevice(device);
  }catch(e){if(e.name!=='NotFoundError')toast('BT: '+e.message,'err');}
}

async function attachDevice(device){
  state.btDevice=device;
  $('bt-device-name').textContent='⏳ '+(device.name||device.id);
  $('bt-device-name').style.color='var(--orange)';
  toast('Verbinde mit '+(device.name||'Gerät')+'…','info');
  device.addEventListener('gattserverdisconnected',onBtDc);
  const server=await device.gatt.connect();
  state.btServer=server;
  const char=await findWritableChar(server);
  if(!char){
    toast('Drucker hat keine druckfähige BLE-Eigenschaft – evtl. nicht kompatibel','err');
    $('bt-device-name').textContent='✗ Nicht kompatibel';
    $('bt-device-name').style.color='var(--red)';
    updateStatus('err','BT: nicht kompatibel');
    return;
  }
  state.btChar=char;
  $('bt-device-name').textContent='✓ '+(device.name||device.id);
  $('bt-device-name').style.color='var(--green)';
  $('btn-bt-connect').style.display='none';
  $('btn-bt-disconnect').style.display='';
  toast('BT-Drucker verbunden!','ok');
  updateStatus('ok','BT: '+(device.name||device.id));
}

function disconnectBT(){
  if(state.btDevice&&state.btDevice.gatt.connected)state.btDevice.gatt.disconnect();
  onBtDc();
}

function onBtDc(){
  state.btChar=null;state.btServer=null;
  $('bt-device-name').textContent='Nicht verbunden';
  $('bt-device-name').style.color='var(--text-muted)';
  $('btn-bt-connect').style.display='';
  $('btn-bt-disconnect').style.display='none';
  updateStatus('warn','BT getrennt');
}

// ── Auto-Reconnect ──
async function autoReconnect(){
  if(!navigator.bluetooth?.getDevices)return;
  try{
    const devices=await navigator.bluetooth.getDevices();
    for(const dev of devices){
      if(!dev.gatt)continue;
      try{
        $('bt-device-name').textContent='⏳ Suche '+(dev.name||dev.id)+'…';
        $('bt-device-name').style.color='var(--orange)';
        updateStatus('warn','Wiederverbindung…');
        const ac=new AbortController();
        const to=setTimeout(()=>ac.abort(),4000);
        await new Promise((res,rej)=>{
          dev.addEventListener('advertisementreceived',async()=>{
            clearTimeout(to);
            try{await attachDevice(dev);res();}catch(e){rej(e);}
          },{once:true});
          dev.watchAdvertisements({signal:ac.signal}).catch(()=>{clearTimeout(to);rej(new Error('timeout'));});
          ac.signal.addEventListener('abort',()=>rej(new Error('timeout')));
        });
        return;
      }catch(e){console.log('Auto-reconnect skip',dev.name,e.message);}
    }
  }catch(e){}
  $('bt-device-name').textContent='Nicht verbunden';
  $('bt-device-name').style.color='var(--text-muted)';
  updateStatus('warn','Kein BT-Drucker gefunden');
}

// ══════ PRINT COMMANDS ══════
function genPrint(v){const l=$('print-lang').value,m=getOutput(),w=parseInt($('label-w').value)||50,h=parseInt($('label-h').value)||30,dw=w*8,dh=h*8;if(l==='zpl')return genZPL(v,m,dw,dh);if(l==='epl')return genEPL(v,m,dw,dh);if(l==='tspl')return genTSPL(v,m,w,h);if(l==='escpos')return genESC(v,m);return v;}
function genZPL(v,m,w,h){const b=m==='qr'?`^FO50,30\n^BQN,2,5\n^FDQA,${v}^FS\n^FO50,200\n^A0N,28,28\n^FD${v}^FS`:`^FO50,30\n^BCN,80,Y,N,N\n^FD${v}^FS\n^FO50,140\n^A0N,28,28\n^FD${v}^FS`;return `^XA\n^PW${w}\n^LL${h}\n${b}\n^XZ`;}
function genEPL(v,m,w,h){const b=m==='qr'?`b50,30,Q,s5,"${v}"\nA50,200,0,3,1,1,N,"${v}"`:`B50,30,0,1,2,4,80,N,"${v}"\nA50,130,0,3,1,1,N,"${v}"`;return `\nN\nq${w}\nQ${h},24\n${b}\nP1\n`;}
function genTSPL(v,m,w,h){const b=m==='qr'?`QRCODE 50,30,L,5,A,0,"${v}"\nTEXT 50,200,"3",0,1,1,"${v}"`:`BARCODE 50,30,"128",80,1,0,2,2,"${v}"\nTEXT 50,130,"3",0,1,1,"${v}"`;return `SIZE ${w} mm, ${h} mm\nGAP 2 mm, 0 mm\nCLS\n${b}\nPRINT 1,1\n`;}
function genESC(v,m){const E='\x1B',G='\x1D';let c=E+'@'+E+'a\x01';if(m==='qr'){const l=v.length+3;c+=G+'(k\x04\x001A2\x00'+G+'(k\x03\x001C\x05'+G+'(k\x03\x001E\x31'+G+'(k'+String.fromCharCode(l&0xFF,(l>>8)&0xFF)+'1P0'+v+G+'(k\x03\x001Q0';}else{c+=G+'h\x50'+G+'w\x02'+G+'H\x02'+G+'k\x49'+String.fromCharCode(v.length)+v;}c+='\n'+v+'\n'+G+'V\x41\x03';return c;}

// ══════ PRINT EXEC ══════
async function executePrint(v){
  const method=getMethod(),data=genPrint(v);let st='OK',err='';
  try{
    if(method==='http')await printHTTP(data);
    else if(method==='cups')await printCUPS(data);
    else if(method==='bt')await printBT(data);
  }catch(e){st='ERR';err=e.message||'Fehler';}
  state.log.unshift({id:Date.now(),value:v,status:st,error:err,time:new Date().toLocaleString('de-DE')});
  renderLog();updateStatus(st==='OK'?'ok':'err',st==='OK'?'Gedruckt':'Fehler: '+err);
  toast(st==='OK'?'Gedruckt: '+v:'Fehler: '+err,st==='OK'?'ok':'err');saveSettings();
}
async function printHTTP(d){let u=$('http-url').value.trim();if(!u)throw new Error('Keine Server-URL');const p=$('http-path').value.trim();if(p)u=u.replace(/\/$/,'')+p;const h={'Content-Type':'application/octet-stream'};const us=$('http-user').value,pw=$('http-pass').value;if(us)h['Authorization']='Basic '+btoa(us+':'+pw);const r=await fetch(u,{method:'POST',headers:h,body:d,mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);}
async function printCUPS(d){const b=$('cups-url').value.trim()||'http://localhost:631',pr=$('cups-printer').value;if(!pr)throw new Error('Kein Drucker');const h={'Content-Type':'application/octet-stream'};const u=$('cups-user').value,p=$('cups-pass').value;if(u)h['Authorization']='Basic '+btoa(u+':'+p);const r=await fetch(b.replace(/\/$/,'')+'/printers/'+pr,{method:'POST',headers:h,body:d});if(!r.ok)throw new Error('CUPS '+r.status);}
async function printBT(d){if(!state.btChar)throw new Error('Kein BT-Drucker');const bytes=new TextEncoder().encode(d);for(let i=0;i<bytes.length;i+=512){const ch=bytes.slice(i,Math.min(i+512,bytes.length));if(state.btChar.properties.writeWithoutResponse)await state.btChar.writeValueWithoutResponse(ch);else await state.btChar.writeValueWithResponse(ch);if(bytes.length>512)await sleep(20);}}

async function loadCups(){const b=$('cups-url').value.trim()||'http://localhost:631';try{const h={};const u=$('cups-user').value,p=$('cups-pass').value;if(u)h['Authorization']='Basic '+btoa(u+':'+p);const r=await fetch(b+'/printers',{headers:h});const t=await r.text();const n=[...new Set([...t.matchAll(/\/printers\/([^"<>\s]+)/g)].map(m=>m[1]))];const s=$('cups-printer');s.innerHTML=n.length?n.map(x=>`<option value="${x}">${x}</option>`).join(''):'<option value="">Keine</option>';toast(n.length?n.length+' Drucker':'Keine Drucker',n.length?'ok':'err');}catch(e){toast('CUPS: '+e.message,'err');}}
async function testHTTP(){const u=$('http-url').value.trim();if(!u){toast('URL fehlt','err');return;}try{const h={};const us=$('http-user').value,pw=$('http-pass').value;if(us)h['Authorization']='Basic '+btoa(us+':'+pw);const r=await fetch(u+($('http-path').value||''),{method:'HEAD',headers:h,mode:'cors'});toast('OK (HTTP '+r.status+')','ok');updateStatus('ok','HTTP ok');}catch(e){toast('Fehler: '+e.message,'err');updateStatus('err','HTTP Fehler');}}

function updateStatus(t,m){$('printer-dot').className='status-dot '+t;$('printer-status').textContent=m;}
function renderLog(){const el=$('log-list');if(!state.log.length){el.innerHTML='<div class="empty-state"><div class="big-icon">📄</div><p>Noch keine Druckaufträge</p></div>';return;}el.innerHTML='<div class="history-list">'+state.log.map((l,i)=>`<div class="log-item"><span class="status-badge ${l.status==='OK'?'ok':'err'}">${l.status}</span><span class="code" title="${esc(l.value)}">${esc(l.value)}</span><span class="time">${l.time}</span><button class="reprint-btn" onclick="window._rl(${i})">↺</button></div>`).join('')+'</div>';}
function exportCSV(){if(!state.log.length){toast('Leer','err');return;}const r='Barcode;Status;Fehler;Zeit\n'+state.log.map(l=>`"${l.value}";"${l.status}";"${l.error||''}";"${l.time}"`).join('\n');const b=new Blob(['\uFEFF'+r],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='drucklog_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exportiert','ok');}
function clearLog(){if(!state.log.length)return;if(!confirm('Log löschen?'))return;state.log=[];renderLog();saveSettings();toast('Gelöscht','info');}
function updatePreview(){$('zpl-preview').textContent=genPrint(SAMPLE);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ══════ EVENTS ══════
$('btn-start-scan').addEventListener('click',startScan);
$('btn-stop-scan').addEventListener('click',stopScan);
$('btn-manual-print').addEventListener('click',()=>{const v=$('manual-input').value.trim();if(v){handleScan(v,'manual');$('manual-input').value='';}});
$('manual-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('btn-manual-print').click();}});
$('btn-test-http').addEventListener('click',testHTTP);
$('btn-load-cups').addEventListener('click',loadCups);
$('btn-bt-connect').addEventListener('click',connectBT);
$('btn-bt-disconnect').addEventListener('click',disconnectBT);
$('btn-test-print').addEventListener('click',()=>executePrint(SAMPLE));
$('btn-export-csv').addEventListener('click',exportCSV);
$('btn-clear-log').addEventListener('click',clearLog);
$('camera-select').addEventListener('change',()=>{if(state.scanning){stopScan();startScan();}});
['print-lang','label-w','label-h'].forEach(id=>{$(id).addEventListener('change',()=>{updatePreview();saveSettings();});$(id).addEventListener('input',()=>{updatePreview();saveSettings();});});
['http-url','http-path','http-user','http-pass','cups-url','cups-user','cups-pass'].forEach(id=>$(id).addEventListener('change',saveSettings));

// ══════ INIT ══════
loadSettings();renderHistory();renderLog();updatePreview();
if(!('BarcodeDetector'in window))overlay.querySelector('span:last-child').textContent='BarcodeDetector nicht verfügbar – Chrome/Edge nötig';
else initDetector();
enumCams();
// Auto-reconnect if BT selected
if(getMethod()==='bt')setTimeout(autoReconnect,500);
})();
</script>
